[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resloom"
version = "0.5.2"
description = "Lightweight workspace for university research groups and labs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Flintglade"}
]
dependencies = [
    "streamlit>=1.67",
    "pydantic>=2.14",
    "fpdf2>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["resloom*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
